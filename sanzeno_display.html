<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Zeno – Programmazione del Giorno</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.3vh 2.7vw 0.9vh;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      background: #f7f7f7;
      flex-shrink: 0;
    }

    .logo { display: flex; align-items: center; gap: 1.7vw; }

    .header-date .day-name { font-size: 1.2vh; letter-spacing: 3px; opacity: 0.5; text-transform: uppercase; margin-bottom: 0.3vh; text-align: center; }
    .header-date .date     { font-size: 3.7vh; font-weight: 700; letter-spacing: -1px; line-height: 1; text-align: center; color: #111111; }

    .header-cal { text-align: right; }
    .header-cal .label { font-size: 0.9vh; letter-spacing: 2px; opacity: 0.5; text-transform: uppercase; margin-bottom: 0.6vh; }
    .cal-list   { display: flex; flex-direction: column; gap: 0.5vh; align-items: flex-end; }
    .cal-badge  { display: flex; align-items: center; gap: 0.7vw; justify-content: flex-end; }
    .cal-dot    { width: 0.8vh; height: 0.8vh; border-radius: 50%; flex-shrink: 0; }
    .cal-name   { font-size: 1.3vh; font-weight: 500; opacity: 0.85; }

    /* ── CONTENT ── */
    .content { display: flex; flex: 1; min-height: 0; }

    .column {
      flex: 1;
      padding: 1.3vh 2.3vw;
      display: flex;
      flex-direction: column;
      gap: 0.55vh;
      overflow: hidden;
    }

    .divider {
      width: 1px;
      background: rgba(0,0,0,0.1);
      flex-shrink: 0;
      margin: 1.3vh 0;
    }

    /* ── EVENT CARD ── */
    .event-card { padding: 0.6vh 1.3vw; }

    .event-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.2vh;
    }

    .event-time       { font-size: 1.2vh; opacity: 0.6; letter-spacing: 0.2px; }
    .event-span-label { font-size: 0.9vh; opacity: 0.5; letter-spacing: 1px; }
    .event-title      { font-size: 1.9vh; font-weight: 600; line-height: 1.2; margin-bottom: 0.25vh; color: #111111; }
    .event-location   { font-size: 1.1vh; opacity: 0.6; }

    /* ── EMPTY STATE ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.3vh;
      opacity: 0.2;
    }

    .empty-state svg   { width: 3.7vh; height: 3.7vh; }
    .empty-state .text { font-size: 1.1vh; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 500; }

    /* ── FOOTER ── */
    .footer {
      padding: 0.6vh 2.7vw;
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: #f7f7f7;
    }

    .footer-clock {
      font-size: 2vh;
      font-weight: 700;
      color: #111111;
      letter-spacing: 1px;
    }

    .footer-update {
      font-size: 1vh;
      opacity: 0.3;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- ── HEADER ── -->
  <div class="header">

    <div class="logo">
      <img src="logo_colori.png" alt="Logo San Zeno" style="height: 10vh; width: auto; mix-blend-mode: multiply; align-self: flex-end;">
    </div>

    <div class="header-date">
      <div class="day-name" id="dayName">—</div>
      <div class="date"     id="dateDisplay">—</div>
    </div>

    <div class="header-cal">
      <div class="label">Calendari</div>
      <div class="cal-list" id="calList"></div>
    </div>

  </div>

  <!-- ── CONTENT ── -->
  <div class="content">

    <div class="column" id="colSinistra"></div>

    <div class="divider"></div>

    <div class="column" id="colDestra"></div>

  </div>

  <!-- ── FOOTER ── -->
  <div class="footer">
    <span class="footer-clock" id="clock">—</span>
    <span class="footer-update" id="lastUpdate">—</span>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════
       CONFIGURAZIONE
    ═══════════════════════════════════════════════════════ */

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKxEhHB_PxwkAtw2HvM0hI2a1voHYvgBrCtKWKNMsMajjdIu-b6UtzazOwLcABL0CB/exec';
    const REFRESH_MS = 10 * 60 * 1000; // 10 minuti

    /* ═══════════════════════════════════════════════════════
       FINE CONFIGURAZIONE
    ═══════════════════════════════════════════════════════ */

    const GIORNI = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
    const MESI   = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                    'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

    /* Converte #RRGGBB in rgba(r,g,b,alpha) */
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    /* ── Orologio in tempo reale ── */
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;
    }

    /* ── HEADER: data ── */
    function updateHeader() {
      const now = new Date();
      document.getElementById('dayName').textContent     = GIORNI[now.getDay()];
      document.getElementById('dateDisplay').textContent = `${now.getDate()} ${MESI[now.getMonth()]} ${now.getFullYear()}`;
    }

    /* ── HEADER: legenda calendari ── */
    function updateCalList(calendars) {
      const list = document.getElementById('calList');
      list.innerHTML = '';
      calendars.forEach(cal => {
        const badge = document.createElement('div');
        badge.className = 'cal-badge';
        badge.innerHTML = `
          <div class="cal-dot" style="background:${cal.color};"></div>
          <span class="cal-name">${cal.name}</span>
        `;
        list.appendChild(badge);
      });
    }

    /* ── Formattazione ora ── */
    function fmtTime(iso) {
      return new Date(iso).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    }

    /* ── Icona empty state ── */
    function emptyIcon() {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="15" x2="15" y2="15"/>
      </svg>`;
    }

    /* ── Rendering di una colonna ── */
    function renderColumn(colId, events) {
      const col = document.getElementById(colId);
      col.innerHTML = '';

      if (events.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = `${emptyIcon()}<div class="text">Nessun evento programmato</div>`;
        col.appendChild(empty);
        return;
      }

      events.forEach(ev => {
        const card = document.createElement('div');
        card.className = 'event-card';
        card.style.borderLeft = `3px solid ${ev.color}`;
        card.style.background = hexToRgba(ev.color, 0.12);

        const metaHTML = ev.isAllDay
          ? `<div class="event-meta"><span class="event-time">Tutto il giorno</span></div>`
          : `<div class="event-meta"><span class="event-time">${ev.startStr} – ${ev.endStr}</span></div>`;

        const locHTML = ev.location
          ? `<div class="event-location">&#9679; ${ev.location}</div>`
          : '';

        card.innerHTML = `${metaHTML}<div class="event-title">${ev.title}</div>${locHTML}`;
        col.appendChild(card);
      });
    }

    /* ── Distribuzione cronologica su due colonne ── */
    function processEvents(items) {
      const events = [];

      items.forEach(ev => {
        if (ev.isAllDay) {
          events.push({ ...ev, startStr: '', endStr: '', sortTime: 0 });
          return;
        }
        const startDate = new Date(ev.startTime);
        events.push({
          ...ev,
          startStr: fmtTime(ev.startTime),
          endStr:   fmtTime(ev.endTime),
          sortTime: startDate.getTime()
        });
      });

      events.sort((a, b) => a.sortTime - b.sortTime);

      const mid = Math.ceil(events.length / 2);
      return { left: events.slice(0, mid), right: events.slice(mid) };
    }

    /* ── Fetch dallo script e render ── */
    async function fetchAndRender() {
      const now = new Date();
      try {
        const res  = await fetch(SCRIPT_URL, { redirect: 'follow' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        updateCalList(data.calendars || []);

        const { left, right } = processEvents(data.events || []);
        renderColumn('colSinistra', left);
        renderColumn('colDestra',   right);

        document.getElementById('lastUpdate').textContent =
          `Aggiornato alle ${now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}`;

      } catch (err) {
        console.error('Errore recupero eventi:', err);
        document.getElementById('lastUpdate').textContent =
          `Errore di aggiornamento – riprovo tra 10 min`;
      }
    }

    /* ── Avvio ── */
    updateClock();
    updateHeader();
    fetchAndRender();
    setInterval(updateClock, 10000); // aggiorna l'ora ogni 10 secondi
    setInterval(() => { updateHeader(); fetchAndRender(); }, REFRESH_MS);
  </script>

</body>
</html>
